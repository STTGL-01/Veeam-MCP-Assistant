# /etc/nginx/sites-available/veeam-assistant
# Replace assistant.corp.example.com (twice) and the two certificate paths.

limit_req_zone $binary_remote_addr zone=va_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name assistant.corp.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name assistant.corp.example.com;

    ssl_certificate     /etc/ssl/veeam-assistant/fullchain.pem;
    ssl_certificate_key /etc/ssl/veeam-assistant/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:va_ssl:10m;

    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Shared proxy settings. X-Forwarded-For is overwritten, not appended,
    # so a client cannot pretend to be another address.
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  "";
    proxy_read_timeout 120s;

    location = /api/login {
        limit_req zone=va_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/register {
        limit_req zone=va_auth burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
